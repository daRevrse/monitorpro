services:
  mysql:
    image: mysql:8.0
    container_name: monitorpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-monitorpro}
      MYSQL_USER: ${DB_USER:-monitorpro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-monitorpro123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Les migrations .sql sont jouées dans l'ordre à la 1re initialisation
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monitorpro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitorpro-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-monitorpro}
      - DB_USER=${DB_USER:-monitorpro}
      - DB_PASSWORD=${DB_PASSWORD:-monitorpro123}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_too_in_production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - monitorpro-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Même domaine : l'API et le WS passent par le proxy nginx du frontend
        REACT_APP_API_URL: /api
        REACT_APP_WS_URL: ""
    container_name: monitorpro-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - monitorpro-network

volumes:
  mysql_data:

networks:
  monitorpro-network:
    driver: bridge
